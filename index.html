  <script>

    // 直角折れ線パス・矢印・分岐ラベル描画
    function drawPath(x1, y1, x2, y2, isSelected, label) {
      ctx.save();
      ctx.strokeStyle = isSelected ? '#2563eb' : '#475569';
      ctx.lineWidth = isSelected ? 2.5 : 2;

      // 直角ルーティング座標計算
      const midX = (x1 + x2) / 2;

      // 1. まず接続線（ライン）を描画
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(midX, y1);
      ctx.lineTo(midX, y2);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // 終点矢印描画
      const arrowAngle = x2 > midX ? 0 : (x2 < midX ? Math.PI : (y2 > y1 ? Math.PI / 2 : -Math.PI / 2));
      drawArrowHead(x2, y2, arrowAngle, isSelected);

      // 2. 線の上に重ねてテキストと白背景ボックスを出力
      if (label) {
        const midY = (y1 + y2) / 2;

        ctx.font = '700 11px sans-serif';
        const textMetrics = ctx.measureText(label);
        const paddingX = 8;
        const paddingY = 4;
        const boxWidth = textMetrics.width + paddingX * 2;
        const boxHeight = 20;

        // 線を覆い隠すための背景カード（丸角）
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = isSelected ? '#2563eb' : '#cbd5e1';
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.roundRect(midX - boxWidth / 2, midY - boxHeight / 2, boxWidth, boxHeight, 6);
        ctx.fill();
        ctx.stroke();

        // 線の上に文字（テキスト）を描画
        ctx.fillStyle = isSelected ? '#1d4ed8' : '#334155';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, midX, midY + 0.5);
      }

      ctx.restore();
    }
