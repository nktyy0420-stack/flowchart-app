<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フローチャート作成アプリ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans JP & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .canvas-bg {
            background-color: #ffffff;
            background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
            background-size: 20px 20px;
        }
        .canvas-bg.no-grid {
            background-image: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col">

    <!-- Top Header / Toolbar -->
    <header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between shadow-sm z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-sm tracking-wide shadow-sm flex items-center gap-1.5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
                フローチャート作成アプリ
            </div>
            <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-medium border border-indigo-100">JIS X 0121 準拠</span>
        </div>

        <!-- Toolbar Actions -->
        <div class="flex items-center gap-1.5">
            <!-- Undo / Redo -->
            <button id="btn-undo" title="元に戻す (Ctrl+Z)" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition disabled:opacity-40 disabled:hover:bg-transparent">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
            </button>
            <button id="btn-redo" title="やり直し (Ctrl+Y)" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition disabled:opacity-40 disabled:hover:bg-transparent">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6"/></svg>
            </button>

            <div class="h-5 w-px bg-slate-200 mx-1"></div>

            <!-- View Controls -->
            <button id="btn-zoom-in" title="拡大 (+)" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>
            </button>
            <button id="btn-zoom-out" title="縮小 (-)" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"/></svg>
            </button>

            <div class="h-5 w-px bg-slate-200 mx-1"></div>

            <!-- Grid Toggle -->
            <button id="btn-toggle-grid" title="グリッド切替" class="p-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            </button>

            <div class="h-5 w-px bg-slate-200 mx-1"></div>

            <!-- Clear Canvas -->
            <button id="btn-clear" title="キャンバスクリア" class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>

            <!-- File IO -->
            <div class="flex items-center gap-1.5 ml-2">
                <span id="autosave-status" class="text-[11px] text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-200/60 flex items-center gap-1 font-medium transition-all duration-200">
                    <svg class="w-3 h-3 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                    自動保存済み
                </span>

                <button id="btn-export-json" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition">
                    名前を付けて保存
                </button>
                <label id="btn-import-json" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition cursor-pointer">
                    ファイルを開く
                    <input type="file" id="file-input-json" accept=".json" class="hidden">
                </label>
                <button id="btn-export-png" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-medium transition shadow-sm flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    PNG出力
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden relative min-h-0">
        
        <!-- Left Sidebar: JIS Node Palette -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10 shrink-0 shadow-sm">
            <div class="p-3 border-b border-slate-100 bg-slate-50">
                <h2 class="text-xs font-bold text-slate-600 uppercase tracking-wider">JIS 記号パレット</h2>
                <p class="text-[11px] text-slate-400 mt-0.5">クリックまたはドラッグで追加</p>
            </div>
            
            <div class="flex-1 overflow-y-auto p-3 space-y-2.5" id="palette-container">
                <!-- Palette items will be generated by JS -->
            </div>
        </aside>

        <!-- Center Workspace / Canvas -->
        <main id="canvas-container" class="flex-1 relative overflow-hidden canvas-bg cursor-grab active:cursor-grabbing select-none">
            
            <!-- Floating Navigation Controls overlay -->
            <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur border border-slate-200 rounded-lg p-1.5 shadow-md flex items-center gap-1 z-10">
                <span id="zoom-level-text" class="text-xs font-mono font-medium text-slate-600 px-2">100%</span>
            </div>

            <!-- SVG Render Canvas -->
            <svg id="svg-canvas" class="w-full h-full absolute inset-0">
                <defs>
                    <!-- Standard Arrow Marker -->
                    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
                    </marker>
                    <!-- Highlighted Edge Arrow Marker -->
                    <marker id="arrowhead-selected" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
                    </marker>
                </defs>
                
                <g id="viewport-group">
                    <!-- Layer 1: Edges / Connection Lines -->
                    <g id="edges-layer"></g>
                    <!-- Layer 2: Temporary Connecting Line while dragging -->
                    <path id="temp-edge-path" d="" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" class="hidden"></path>
                    <!-- Layer 3: Nodes -->
                    <g id="nodes-layer"></g>
                    <!-- Layer 4: Interactive Anchor Highlights -->
                    <g id="anchors-layer"></g>
                </g>
            </svg>
        </main>

        <!-- Right Inspector Sidebar -->
        <aside class="w-72 bg-white border-l border-slate-200 flex flex-col z-10 shrink-0 shadow-sm" id="inspector-panel">
            <div class="p-3 border-b border-slate-100 bg-slate-50">
                <h2 class="text-xs font-bold text-slate-600 uppercase tracking-wider">プロパティ</h2>
                <p class="text-[11px] text-slate-400 mt-0.5">選択された要素の編集</p>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-5" id="inspector-content">
                <!-- Inspector form dynamically rendered by JS -->
            </div>
        </aside>

    </div>

    <!-- Confirmation Modal Dialog -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-sm w-full p-5 space-y-4">
            <h3 class="text-sm font-bold text-slate-800">キャンバスクリアの確認</h3>
            <p class="text-xs text-slate-600">キャンバス内のすべての図形と接続線を削除しますか？この操作は戻せます。</p>
            <div class="flex justify-end gap-2 pt-2">
                <button id="modal-btn-cancel" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition">キャンセル</button>
                <button id="modal-btn-confirm" class="px-3 py-1.5 text-xs bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-medium transition">削除する</button>
            </div>
        </div>
    </div>

    <script>
        const JIS_SHAPES = [
            { type: 'terminal', name: '端子 (Terminal)', desc: '開始・終了', defaultLabel: '開始' },
            { type: 'process', name: '処理 (Process)', desc: '代入・計算', defaultLabel: '処理' },
            { type: 'decision', name: '判断 (Decision)', desc: '条件分岐', defaultLabel: '条件判断?' },
            { type: 'data', name: 'データ (Data I/O)', desc: 'データ入出力', defaultLabel: 'データ入力' },
            { type: 'loop-start', name: 'ループ開始', desc: '繰り返し起点', defaultLabel: 'ループ開始' },
            { type: 'loop-end', name: 'ループ終了', desc: '繰り返し終端', defaultLabel: 'ループ終了' },
            { type: 'document', name: '書類 (Document)', desc: '帳票・印刷', defaultLabel: '書類出力' },
            { type: 'subroutine', name: '定義済み処理', desc: 'サブルーチン', defaultLabel: 'サブ処理' },
            { type: 'connector', name: '結合手 (Connector)', desc: 'フローの中継点', defaultLabel: '1' }
        ];

        const LOCAL_STORAGE_KEY = 'jis_flowchart_studio_data_v1';

        const store = {
            nodes: [],
            edges: [],
            selectedNodeId: null,
            selectedEdgeId: null,
            
            zoom: 1.0,
            panX: 0,
            panY: 0,
            showGrid: true,
            snapToGrid: true,
            gridSize: 20,

            isPanning: false,
            panStart: { x: 0, y: 0 },
            isConnecting: false,
            connectStart: null,

            history: [],
            historyIndex: -1,
            maxHistory: 30,

            nextId: Date.now(),
            generateId() { return 'elem_' + (this.nextId++); },

            saveToLocalStorage() {
                try {
                    const payload = {
                        nodes: this.nodes,
                        edges: this.edges,
                        updatedAt: Date.now()
                    };
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
                    this.showSaveBadge();
                } catch (e) {
                    console.warn('LocalStorage save failed:', e);
                }
            },

            loadFromLocalStorage() {
                try {
                    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (!raw) return false;
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed.nodes) && Array.isArray(parsed.edges)) {
                        this.nodes = parsed.nodes;
                        this.edges = parsed.edges;
                        return true;
                    }
                } catch (e) {
                    console.warn('LocalStorage load failed:', e);
                }
                return false;
            },

            clearLocalStorage() {
                try {
                    localStorage.removeItem(LOCAL_STORAGE_KEY);
                } catch (e) {
                    console.warn('LocalStorage clear failed:', e);
                }
            },

            showSaveBadge() {
                const badge = document.getElementById('autosave-status');
                if (badge) {
                    badge.classList.remove('opacity-50');
                    setTimeout(() => badge.classList.add('opacity-100'), 50);
                }
            },

            saveState() {
                if (this.historyIndex < this.history.length - 1) {
                    this.history = this.history.slice(0, this.historyIndex + 1);
                }
                const state = {
                    nodes: JSON.parse(JSON.stringify(this.nodes)),
                    edges: JSON.parse(JSON.stringify(this.edges))
                };
                this.history.push(state);
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                } else {
                    this.historyIndex++;
                }
                
                this.saveToLocalStorage();
                updateUndoRedoButtons();
            },

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    const state = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                    this.nodes = state.nodes;
                    this.edges = state.edges;
                    this.selectedNodeId = null;
                    this.selectedEdgeId = null;
                    this.saveToLocalStorage();
                    renderCanvas();
                    updateInspector();
                    updateUndoRedoButtons();
                }
            },

            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    const state = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                    this.nodes = state.nodes;
                    this.edges = state.edges;
                    this.selectedNodeId = null;
                    this.selectedEdgeId = null;
                    this.saveToLocalStorage();
                    renderCanvas();
                    updateInspector();
                    updateUndoRedoButtons();
                }
            }
        };

        function initPalette() {
            const container = document.getElementById('palette-container');
            container.innerHTML = '';

            JIS_SHAPES.forEach(shape => {
                const item = document.createElement('div');
                item.className = 'p-2.5 bg-slate-50 hover:bg-indigo-50/70 border border-slate-200 hover:border-indigo-300 rounded-lg cursor-grab transition flex items-center gap-3 group';
                item.setAttribute('draggable', 'true');

                const previewSvg = getShapePreviewSvg(shape.type);

                item.innerHTML = `
                    <div class="w-9 h-8 bg-white border border-slate-200 rounded flex items-center justify-center shrink-0 group-hover:border-indigo-400 shadow-2xs">
                        ${previewSvg}
                    </div>
                    <div class="overflow-hidden">
                        <div class="text-xs font-semibold text-slate-700 group-hover:text-indigo-900 truncate">${shape.name}</div>
                        <div class="text-[10px] text-slate-400 truncate">${shape.desc}</div>
                    </div>
                `;

                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('shapeType', shape.type);
                });

                item.addEventListener('click', () => {
                    addNodeToCanvas(shape.type, 350, 250);
                });

                container.appendChild(item);
            });
        }

        function getShapePreviewSvg(type) {
            const stroke = "#475569";
            const fill = "#f8fafc";
            switch(type) {
                case 'terminal':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><rect x="2" y="2" width="36" height="20" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
                case 'process':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><rect x="2" y="2" width="36" height="20" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
                case 'decision':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><polygon points="20,2 38,12 20,22 2,12" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
                case 'data':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><polygon points="8,2 38,2 32,22 2,22" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
                case 'loop-start':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><polygon points="8,2 32,2 38,8 38,22 2,22 2,8" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
                case 'loop-end':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><polygon points="2,2 38,2 38,16 32,22 8,22 2,16" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
                case 'document':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><path d="M 2 2 L 38 2 L 38 18 Q 28 24 18 18 Q 10 14 2 20 Z" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
                case 'subroutine':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><rect x="2" y="2" width="36" height="20" fill="${fill}" stroke="${stroke}" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="22" stroke="${stroke}" stroke-width="1.5"/><line x1="32" y1="2" x2="32" y2="22" stroke="${stroke}" stroke-width="1.5"/></svg>`;
                case 'connector':
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><circle cx="20" cy="12" r="9" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
                default:
                    return `<svg class="w-7 h-5" viewBox="0 0 40 24"><rect x="2" y="2" width="36" height="20" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
            }
        }

        function loadDefaultTemplate() {
            store.nodes = [
                { id: 'node_start', type: 'terminal', label: '開始', x: 400, y: 120, width: 110, height: 48, fontSize: 14, strokeWidth: 2, color: 'white' },
                { id: 'node_end', type: 'terminal', label: '終了', x: 400, y: 280, width: 110, height: 48, fontSize: 14, strokeWidth: 2, color: 'white' }
            ];

            store.edges = [
                { id: 'edge_1', sourceId: 'node_start', sourceAnchor: 'bottom', targetId: 'node_end', targetAnchor: 'top', label: '', type: 'orthogonal' }
            ];

            store.saveState();
            renderCanvas();
            updateInspector();
            fitViewToNodes();
        }

        function renderCanvas() {
            const viewport = document.getElementById('viewport-group');
            viewport.setAttribute('transform', `translate(${store.panX}, ${store.panY}) scale(${store.zoom})`);

            document.getElementById('zoom-level-text').textContent = `${Math.round(store.zoom * 100)}%`;

            const container = document.getElementById('canvas-container');
            if (store.showGrid) {
                container.classList.remove('no-grid');
            } else {
                container.classList.add('no-grid');
            }

            renderEdges();
            renderNodes();
            renderAnchors();
        }

        function renderEdges() {
            const layer = document.getElementById('edges-layer');
            layer.innerHTML = '';

            store.edges.forEach(edge => {
                const sourceNode = store.nodes.find(n => n.id === edge.sourceId);
                const targetNode = store.nodes.find(n => n.id === edge.targetId);
                if (!sourceNode || !targetNode) return;

                const startPt = getAnchorCoordinates(sourceNode, edge.sourceAnchor);
                const endPt = getAnchorCoordinates(targetNode, edge.targetAnchor);

                const pathD = calculateEdgePath(startPt, endPt, edge.sourceAnchor, edge.targetAnchor, edge.type);
                const isSelected = store.selectedEdgeId === edge.id;

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'cursor-pointer group');
                g.onclick = (e) => {
                    e.stopPropagation();
                    store.selectedEdgeId = edge.id;
                    store.selectedNodeId = null;
                    renderCanvas();
                    updateInspector();
                };

                const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                hitPath.setAttribute('d', pathD);
                hitPath.setAttribute('fill', 'none');
                hitPath.setAttribute('stroke', 'transparent');
                hitPath.setAttribute('stroke-width', '14');

                const visiblePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                visiblePath.setAttribute('d', pathD);
                visiblePath.setAttribute('fill', 'none');
                visiblePath.setAttribute('stroke', isSelected ? '#3b82f6' : '#1e293b');
                visiblePath.setAttribute('stroke-width', isSelected ? '2.5' : '1.8');
                visiblePath.setAttribute('marker-end', isSelected ? 'url(#arrowhead-selected)' : 'url(#arrowhead)');
                visiblePath.setAttribute('class', 'transition-all duration-150');

                g.appendChild(hitPath);
                g.appendChild(visiblePath);

                if (edge.label && edge.label.trim() !== '') {
                    const midPt = getPathMidPoint(startPt, endPt, pathD);
                    const textBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');

                    text.setAttribute('x', midPt.x);
                    text.setAttribute('y', midPt.y);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('dominant-baseline', 'central');
                    text.setAttribute('fill', isSelected ? '#2563eb' : '#334155');
                    text.setAttribute('font-size', '11');
                    text.setAttribute('font-weight', '600');
                    text.textContent = edge.label;

                    const labelWidth = edge.label.length * 8 + 10;
                    textBg.setAttribute('x', midPt.x - labelWidth / 2);
                    textBg.setAttribute('y', midPt.y - 9);
                    textBg.setAttribute('width', labelWidth);
                    textBg.setAttribute('height', '18');
                    textBg.setAttribute('rx', '4');
                    textBg.setAttribute('fill', '#ffffff');
                    textBg.setAttribute('stroke', isSelected ? '#93c5fd' : '#cbd5e1');
                    textBg.setAttribute('stroke-width', '1');

                    g.appendChild(textBg);
                    g.appendChild(text);
                }

                layer.appendChild(g);
            });
        }

        function calculateEdgePath(start, end, sAnchor, tAnchor, type) {
            if (type === 'straight') {
                return `M ${start.x} ${start.y} L ${end.x} ${end.y}`;
            }

            if (type === 'bezier') {
                const dx = Math.abs(end.x - start.x) / 2;
                const dy = Math.abs(end.y - start.y) / 2;
                let c1 = { ...start }, c2 = { ...end };

                if (sAnchor === 'bottom') c1.y += dy;
                if (sAnchor === 'top') c1.y -= dy;
                if (sAnchor === 'right') c1.x += dx;
                if (sAnchor === 'left') c1.x -= dx;

                if (tAnchor === 'top') c2.y -= dy;
                if (tAnchor === 'bottom') c2.y += dy;
                if (tAnchor === 'right') c2.x += dx;
                if (tAnchor === 'left') c2.x -= dx;

                return `M ${start.x} ${start.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${end.x} ${end.y}`;
            }

            const margin = 40;

            if (sAnchor === 'left' && tAnchor === 'left') {
                const minX = Math.min(start.x, end.x) - margin;
                return `M ${start.x} ${start.y} L ${minX} ${start.y} L ${minX} ${end.y} L ${end.x} ${end.y}`;
            }

            if (sAnchor === 'right' && tAnchor === 'right') {
                const maxX = Math.max(start.x, end.x) + margin;
                return `M ${start.x} ${start.y} L ${maxX} ${start.y} L ${maxX} ${end.y} L ${end.x} ${end.y}`;
            }

            if (sAnchor === 'top' && tAnchor === 'top') {
                const minY = Math.min(start.y, end.y) - margin;
                return `M ${start.x} ${start.y} L ${start.x} ${minY} L ${end.x} ${minY} L ${end.x} ${end.y}`;
            }

            if (sAnchor === 'bottom' && tAnchor === 'bottom') {
                const maxY = Math.max(start.y, end.y) + margin;
                return `M ${start.x} ${start.y} L ${start.x} ${maxY} L ${end.x} ${maxY} L ${end.x} ${end.y}`;
            }

            let midY = (start.y + end.y) / 2;
            return `M ${start.x} ${start.y} L ${start.x} ${midY} L ${end.x} ${midY} L ${end.x} ${end.y}`;
        }

        function getPathMidPoint(start, end, pathD) {
            return {
                x: (start.x + end.x) / 2,
                y: (start.y + end.y) / 2
            };
        }

        function renderNodes() {
            const layer = document.getElementById('nodes-layer');
            layer.innerHTML = '';

            store.nodes.forEach(node => {
                const isSelected = store.selectedNodeId === node.id;
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('transform', `translate(${node.x - node.width/2}, ${node.y - node.height/2})`);
                g.setAttribute('class', 'cursor-move');

                let strokeColor = '#1e293b';
                let fillColor = '#ffffff';

                if (node.color === 'indigo') { fillColor = '#eef2ff'; strokeColor = '#4338ca'; }
                else if (node.color === 'emerald') { fillColor = '#ecfdf5'; strokeColor = '#047857'; }
                else if (node.color === 'amber') { fillColor = '#fffbeb'; strokeColor = '#b45309'; }
                else if (node.color === 'cyan') { fillColor = '#ecfeff'; strokeColor = '#0e7490'; }
                else if (node.color === 'rose') { fillColor = '#fff1f2'; strokeColor = '#be123c'; }

                if (isSelected) {
                    strokeColor = '#2563eb';
                }

                const shapeSvg = createNodeShapeSvg(node, fillColor, strokeColor, isSelected);
                g.appendChild(shapeSvg);

                const textGroup = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textGroup.setAttribute('x', node.width / 2);
                textGroup.setAttribute('y', node.height / 2);
                textGroup.setAttribute('text-anchor', 'middle');
                textGroup.setAttribute('dominant-baseline', 'central');
                textGroup.setAttribute('font-size', node.fontSize || 13);
                textGroup.setAttribute('font-weight', '500');
                textGroup.setAttribute('fill', '#0f172a');

                const lines = (node.label || '').split('\n');
                const lineHeight = (node.fontSize || 13) * 1.25;
                const startY = (node.height / 2) - ((lines.length - 1) * lineHeight) / 2;

                lines.forEach((lineText, idx) => {
                    const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                    tspan.setAttribute('x', node.width / 2);
                    tspan.setAttribute('y', startY + (idx * lineHeight));
                    tspan.textContent = lineText;
                    textGroup.appendChild(tspan);
                });

                g.appendChild(textGroup);

                g.onmousedown = (e) => {
                    if (e.button !== 0) return;
                    e.stopPropagation();

                    store.selectedNodeId = node.id;
                    store.selectedEdgeId = null;
                    renderCanvas();
                    updateInspector();

                    const startMouseX = e.clientX;
                    const startMouseY = e.clientY;
                    const origX = node.x;
                    const origY = node.y;

                    function onMouseMove(me) {
                        const dx = (me.clientX - startMouseX) / store.zoom;
                        const dy = (me.clientY - startMouseY) / store.zoom;
                        let newX = origX + dx;
                        let newY = origY + dy;

                        if (store.snapToGrid) {
                            newX = Math.round(newX / store.gridSize) * store.gridSize;
                            newY = Math.round(newY / store.gridSize) * store.gridSize;
                        }

                        node.x = newX;
                        node.y = newY;
                        renderCanvas();
                    }

                    function onMouseUp() {
                        window.removeEventListener('mousemove', onMouseMove);
                        window.removeEventListener('mouseup', onMouseUp);
                        store.saveState();
                    }

                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                };

                layer.appendChild(g);
            });
        }

        function createNodeShapeSvg(node, fill, stroke, isSelected) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            const w = node.width;
            const h = node.height;
            const sw = isSelected ? (node.strokeWidth || 2) + 1 : (node.strokeWidth || 2);

            let element;

            switch(node.type) {
                case 'terminal':
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    element.setAttribute('x', '0'); element.setAttribute('y', '0');
                    element.setAttribute('width', w); element.setAttribute('height', h);
                    element.setAttribute('rx', h / 2);
                    break;
                case 'process':
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    element.setAttribute('x', '0'); element.setAttribute('y', '0');
                    element.setAttribute('width', w); element.setAttribute('height', h);
                    element.setAttribute('rx', '3');
                    break;
                case 'decision':
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    element.setAttribute('points', `${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}`);
                    break;
                case 'data':
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    element.setAttribute('points', `${w*0.2},0 ${w},0 ${w*0.8},${h} 0,${h}`);
                    break;
                case 'loop-start':
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    element.setAttribute('points', `12,0 ${w-12},0 ${w},12 ${w},${h} 0,${h} 0,12`);
                    break;
                case 'loop-end':
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    element.setAttribute('points', `0,0 ${w},0 ${w},${h-12} ${w-12},${h} 12,${h} 0,${h-12}`);
                    break;
                case 'document':
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    element.setAttribute('d', `M 0 0 L ${w} 0 L ${w} ${h*0.8} Q ${w*0.75} ${h*1.1} ${w*0.5} ${h*0.8} Q ${w*0.25} ${h*0.5} 0 ${h*0.9} Z`);
                    break;
                case 'subroutine':
                    const subG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', '0'); rect.setAttribute('y', '0');
                    rect.setAttribute('width', w); rect.setAttribute('height', h);
                    rect.setAttribute('fill', fill); rect.setAttribute('stroke', stroke); rect.setAttribute('stroke-width', sw);

                    const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    l1.setAttribute('x1', '12'); l1.setAttribute('y1', '0');
                    l1.setAttribute('x2', '12'); l1.setAttribute('y2', h);
                    l1.setAttribute('stroke', stroke); l1.setAttribute('stroke-width', sw);

                    const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    l2.setAttribute('x1', w - 12); l2.setAttribute('y1', '0');
                    l2.setAttribute('x2', w - 12); l2.setAttribute('y2', h);
                    l2.setAttribute('stroke', stroke); l2.setAttribute('stroke-width', sw);

                    subG.appendChild(rect); subG.appendChild(l1); subG.appendChild(l2);
                    return subG;
                case 'connector':
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    element.setAttribute('cx', w/2); element.setAttribute('cy', h/2);
                    element.setAttribute('r', Math.min(w, h)/2);
                    break;
                default:
                    element = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    element.setAttribute('x', '0'); element.setAttribute('y', '0');
                    element.setAttribute('width', w); element.setAttribute('height', h);
            }

            element.setAttribute('fill', fill);
            element.setAttribute('stroke', stroke);
            element.setAttribute('stroke-width', sw);

            g.appendChild(element);
            return g;
        }

        function renderAnchors() {
            const layer = document.getElementById('anchors-layer');
            layer.innerHTML = '';

            const anchors = ['top', 'bottom', 'left', 'right'];

            store.nodes.forEach(node => {
                anchors.forEach(pos => {
                    const coord = getAnchorCoordinates(node, pos);

                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                    const hitCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    hitCircle.setAttribute('cx', coord.x); hitCircle.setAttribute('cy', coord.y);
                    hitCircle.setAttribute('r', '22'); hitCircle.setAttribute('fill', 'transparent');
                    hitCircle.setAttribute('class', 'cursor-crosshair');

                    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    dot.setAttribute('cx', coord.x); dot.setAttribute('cy', coord.y);
                    dot.setAttribute('r', '5'); dot.setAttribute('fill', '#3b82f6');
                    dot.setAttribute('stroke', '#ffffff'); dot.setAttribute('stroke-width', '1.5');
                    dot.setAttribute('class', 'opacity-0 group-hover:opacity-100 hover:opacity-100 transition-opacity duration-150');

                    g.appendChild(hitCircle);
                    g.appendChild(dot);
                    g.setAttribute('class', 'group');

                    g.onmousedown = (e) => {
                        e.stopPropagation();
                        e.preventDefault();

                        store.isConnecting = true;
                        store.connectStart = { nodeId: node.id, anchor: pos, startPt: coord };

                        const tempPath = document.getElementById('temp-edge-path');
                        tempPath.classList.remove('hidden');

                        function onConnectingMove(me) {
                            const rect = document.getElementById('canvas-container').getBoundingClientRect();
                            const currentX = (me.clientX - rect.left - store.panX) / store.zoom;
                            const currentY = (me.clientY - rect.top - store.panY) / store.zoom;

                            tempPath.setAttribute('d', `M ${coord.x} ${coord.y} L ${currentX} ${currentY}`);
                        }

                        function onConnectingUp(me) {
                            window.removeEventListener('mousemove', onConnectingMove);
                            window.removeEventListener('mouseup', onConnectingUp);

                            tempPath.classList.add('hidden');
                            store.isConnecting = false;

                            const rect = document.getElementById('canvas-container').getBoundingClientRect();
                            const dropX = (me.clientX - rect.left - store.panX) / store.zoom;
                            const dropY = (me.clientY - rect.top - store.panY) / store.zoom;

                            const target = findNearestAnchor(dropX, dropY, node.id);
                            if (target) {
                                store.edges.push({
                                    id: store.generateId(),
                                    sourceId: store.connectStart.nodeId,
                                    sourceAnchor: store.connectStart.anchor,
                                    targetId: target.nodeId,
                                    targetAnchor: target.anchor,
                                    label: '',
                                    type: 'orthogonal'
                                });
                                store.saveState();
                                renderCanvas();
                            }
                        }

                        window.addEventListener('mousemove', onConnectingMove);
                        window.addEventListener('mouseup', onConnectingUp);
                    };

                    layer.appendChild(g);
                });
            });
        }

        function getAnchorCoordinates(node, position) {
            switch(position) {
                case 'top': return { x: node.x, y: node.y - node.height / 2 };
                case 'bottom': return { x: node.x, y: node.y + node.height / 2 };
                case 'left': return { x: node.x - node.width / 2, y: node.y };
                case 'right': return { x: node.x + node.width / 2, y: node.y };
                default: return { x: node.x, y: node.y };
            }
        }

        function findNearestAnchor(x, y, excludeNodeId) {
            let nearest = null;
            let minDistance = 30;

            store.nodes.forEach(node => {
                if (node.id === excludeNodeId) return;
                ['top', 'bottom', 'left', 'right'].forEach(pos => {
                    const coord = getAnchorCoordinates(node, pos);
                    const dist = Math.hypot(coord.x - x, coord.y - y);
                    if (dist < minDistance) {
                        minDistance = dist;
                        nearest = { nodeId: node.id, anchor: pos };
                    }
                });
            });

            return nearest;
        }

        function fitViewToNodes() {
            if (store.nodes.length === 0) return;

            const svg = document.getElementById('svg-canvas');
            if (!svg) return;
            const rect = svg.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            store.nodes.forEach(n => {
                minX = Math.min(minX, n.x - n.width / 2);
                minY = Math.min(minY, n.y - n.height / 2);
                maxX = Math.max(maxX, n.x + n.width / 2);
                maxY = Math.max(maxY, n.y + n.height / 2);
            });

            const padding = 80;
            const contentWidth = (maxX - minX) + padding * 2;
            const contentHeight = (maxY - minY) + padding * 2;
            const contentCenterX = (minX + maxX) / 2;
            const contentCenterY = (minY + maxY) / 2;

            const zoomX = rect.width / contentWidth;
            const zoomY = rect.height / contentHeight;
            let targetZoom = Math.min(zoomX, zoomY, 1.1);
            targetZoom = Math.max(targetZoom, 0.5);

            store.zoom = targetZoom;
            store.panX = (rect.width / 2) - (contentCenterX * store.zoom);
            store.panY = (rect.height / 2) - (contentCenterY * store.zoom);
        }

        function addNodeToCanvas(type, x, y) {
            const shapeInfo = JIS_SHAPES.find(s => s.type === type);
            const newNode = {
                id: store.generateId(),

                label: shapeInfo ? shapeInfo.defaultLabel : 'ノード',

                width: type === 'connector' ? 44 : 110,
                height: type === 'connector' ? 44 : 50,

                color: 'white'
            };

            store.nodes.push(newNode);
            store.selectedNodeId = newNode.id;
            store.selectedEdgeId = null;
            store.saveState();
            renderCanvas();
            updateInspector();
        }

            }
        }

        function updateUndoRedoButtons() {
            document.getElementById('btn-undo').disabled = store.historyIndex <= 0;
            document.getElementById('btn-redo').disabled = store.historyIndex >= store.history.length - 1;
        }

        function setupViewportInteractions() {
            const container = document.getElementById('canvas-container');

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.ctrlKey || e.metaKey) {
                    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                    store.zoom = Math.min(Math.max(store.zoom * zoomFactor, 0.3), 3.0);
                } else {
                    if (e.shiftKey) {
                        store.panX -= e.deltaY;
                    } else {
                        store.panY -= e.deltaY;
                    }
                }
                renderCanvas();
            }, { passive: false });

            container.onmousedown = (e) => {
                if (e.target === container || e.target.tagName === 'svg' || e.button === 1) {
                    store.isPanning = true;
                    store.panStart = { x: e.clientX - store.panX, y: e.clientY - store.panY };
                    store.selectedNodeId = null;
                    store.selectedEdgeId = null;
                    renderCanvas();
                    updateInspector();
                }
            };

            window.addEventListener('mousemove', (e) => {
                if (store.isPanning) {
                    store.panX = e.clientX - store.panStart.x;
                    store.panY = e.clientY - store.panStart.y;
                    renderCanvas();
                }
            });

            window.addEventListener('mouseup', () => {
                store.isPanning = false;
            });

            container.addEventListener('dragover', (e) => e.preventDefault());
            container.addEventListener('drop', (e) => {
                e.preventDefault();
                const shapeType = e.dataTransfer.getData('shapeType');
                if (shapeType) {
                    const rect = container.getBoundingClientRect();
                    const dropX = (e.clientX - rect.left - store.panX) / store.zoom;
                    const dropY = (e.clientY - rect.top - store.panY) / store.zoom;
                    addNodeToCanvas(shapeType, dropX, dropY);
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) store.redo();
                    else store.undo();
                } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                    e.preventDefault();
                    store.redo();
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (store.selectedNodeId) {
                        store.nodes = store.nodes.filter(n => n.id !== store.selectedNodeId);
                        store.edges = store.edges.filter(edge => edge.sourceId !== store.selectedNodeId && edge.targetId !== store.selectedNodeId);
                        store.selectedNodeId = null;
                        store.saveState();
                        renderCanvas();
                        updateInspector();
                    } else if (store.selectedEdgeId) {
                        store.edges = store.edges.filter(edge => edge.id !== store.selectedEdgeId);
                        store.selectedEdgeId = null;
                        store.saveState();
                        renderCanvas();
                        updateInspector();
                    }
                }
            });
        }

        function setupToolbar() {
            document.getElementById('btn-undo').onclick = () => store.undo();
            document.getElementById('btn-redo').onclick = () => store.redo();

            document.getElementById('btn-zoom-in').onclick = () => {
                store.zoom = Math.min(store.zoom * 1.15, 3.0);
                renderCanvas();
            };
            document.getElementById('btn-zoom-out').onclick = () => {
                store.zoom = Math.max(store.zoom / 1.15, 0.3);
                renderCanvas();
            };

            document.getElementById('btn-toggle-grid').onclick = () => {
                store.showGrid = !store.showGrid;
                renderCanvas();
            };

            const confirmModal = document.getElementById('confirm-modal');
            const btnCancel = document.getElementById('modal-btn-cancel');
            const btnConfirm = document.getElementById('modal-btn-confirm');

            document.getElementById('btn-clear').onclick = () => {
                confirmModal.classList.remove('hidden');
            };

            btnCancel.onclick = () => {
                confirmModal.classList.add('hidden');
            };

            btnConfirm.onclick = () => {
                confirmModal.classList.add('hidden');
                store.nodes = [];
                store.edges = [];
                store.selectedNodeId = null;
                store.selectedEdgeId = null;
                store.clearLocalStorage();
                store.saveState();
                renderCanvas();
                updateInspector();
            };

            document.getElementById('btn-export-json').onclick = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                    nodes: store.nodes,
                    edges: store.edges
                }, null, 2));
                const dlAnchor = document.createElement('a');
                dlAnchor.setAttribute("href", dataStr);
                dlAnchor.setAttribute("download", `flowchart_${Date.now()}.json`);
                document.body.appendChild(dlAnchor);
                dlAnchor.click();
                dlAnchor.remove();
            };

            document.getElementById('file-input-json').onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        if (parsed.nodes && parsed.edges) {
                            store.nodes = parsed.nodes;
                            store.edges = parsed.edges;
                            store.selectedNodeId = null;
                            store.selectedEdgeId = null;
                            store.saveState();
                            renderCanvas();
                            updateInspector();
                            fitViewToNodes();
                        }
                    } catch (err) {
                        console.error('JSON import error:', err);
                    }
                };
                reader.readAsText(file);
            };

            function getCleanSvgString() {
                const prevNode = store.selectedNodeId;
                const prevEdge = store.selectedEdgeId;
                store.selectedNodeId = null;
                store.selectedEdgeId = null;
                renderCanvas();

                const anchorsLayer = document.getElementById('anchors-layer');
                const tempEdgePath = document.getElementById('temp-edge-path');
                if (anchorsLayer) anchorsLayer.style.display = 'none';
                if (tempEdgePath) tempEdgePath.style.display = 'none';

                const svg = document.getElementById('svg-canvas');
                const svgData = new XMLSerializer().serializeToString(svg);

                if (anchorsLayer) anchorsLayer.style.display = '';
                if (tempEdgePath) tempEdgePath.style.display = '';
                store.selectedNodeId = prevNode;
                store.selectedEdgeId = prevEdge;
                renderCanvas();

                return svgData;
            }

            document.getElementById('btn-export-png').onclick = () => {
                const svgData = getCleanSvgString();
                const svg = document.getElementById('svg-canvas');
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();

                const rect = svg.getBoundingClientRect();
                canvas.width = rect.width * 2;
                canvas.height = rect.height * 2;

                img.onload = () => {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.scale(2, 2);
                    ctx.drawImage(img, 0, 0);
                    const a = document.createElement('a');
                    a.download = `flowchart_${Date.now()}.png`;
                    a.href = canvas.toDataURL('image/png');
                    a.click();
                };

                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            };
        }

        window.onload = function() {
            initPalette();
            setupViewportInteractions();
            setupToolbar();

            const hasSavedData = store.loadFromLocalStorage();
            if (hasSavedData) {
                store.saveState();
                renderCanvas();
                updateInspector();
                fitViewToNodes();
            } else {
                loadDefaultTemplate();
            }
        };
    </script>
</body>
</html>
